# NFS CSI driver. Mounting the Synology NFS exports as PersistentVolumes.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 1h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 30m
  # kube-system: node plugin is privileged (it does the mounts), and
  # kube-system is expected to be exempt from the cluster's restricted Pod Security default.
  targetNamespace: kube-system
  releaseName: csi-driver-nfs
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.4"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      replicas: 1
    externalSnapshotter:
      enabled: false
