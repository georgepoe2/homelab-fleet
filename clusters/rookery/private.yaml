# status: needs-rewrite (Claude draft, 2026-10-19). Put comments in your own words before pushing.
---
# Sources that need secrets. Separate from flux-system because the bootstrap
# Kustomization has no SOPS decryption.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/sources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Apps that live in the private repo. Same pattern as `apps`, different source.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: private-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-sources
    - name: infra-networking
    - name: infra-storage
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./apps
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: homelab-fleet-private
  decryption:
    provider: sops
    secretRef:
      name: sops-age
